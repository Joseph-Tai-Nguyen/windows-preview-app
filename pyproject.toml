[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "winpreview"
version = "0.1.0"
description = "A lightweight PDF page organizer for Windows, inspired by the page-editing workflow of macOS Preview."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "PyMuPDF>=1.24",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.10",
]

[project.gui-scripts]
winpreview = "winpreview.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"winpreview.resources" = ["icons/*.ico", "icons/*.png", "icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Qt overrides must keep camelCase names (dropEvent, sizeHint, ...).
ignore = ["N802"]
# Typographic characters used intentionally in UI strings.
allowed-confusables = ["›", "“", "”", "’", "·", "—"]
